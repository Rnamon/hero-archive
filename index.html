<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE HERO ARCHIVE</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0f1d">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#0d1322;--panel:#151d33;--panel2:#1b2542;--line:#2a375c;--text:#e9edf7;--mute:#9aa7c7;--gold:#f2b84b;--blue:#58a8ff;--green:#4cd08a;--red:#ff7a7a;--amber:#ffcf5c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
header{position:sticky;top:0;z-index:5;background:#0a0f1d;border-bottom:1px solid var(--line);padding:10px 14px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-size:18px;letter-spacing:.12em;color:var(--gold)}
.brand small{color:var(--mute)}
nav{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
nav button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--mute);white-space:nowrap}
nav button[aria-current="page"]{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:600}
main{max-width:1000px;margin:0 auto;padding:16px 14px 60px}
h2{margin:6px 0 12px;font-size:20px}
h3{margin:22px 0 8px;font-size:16px;color:var(--gold)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile .big{font-size:30px;font-weight:700}
.tile .sub{color:var(--mute);font-size:13px}
.bar{height:10px;background:#0a0f1d;border-radius:99px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold))}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;width:100%;text-align:left}
button.row:hover{border-color:var(--gold)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .m{color:var(--mute);font-size:13px}
.badge{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--mute);margin-right:4px;white-space:nowrap}
.badge.ok{color:var(--green);border-color:#2c6b4d}
.badge.warn{color:var(--amber);border-color:#7a6422}
.badge.bad{color:var(--red);border-color:#7a3a3a}
.badge.gold{color:var(--gold);border-color:#7a6422}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ctrl input,.ctrl select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ctrl input[type=search]{flex:1;min-width:180px}
.ctrl select{max-width:100%;min-width:0;text-overflow:ellipsis}
#fset{flex:1 1 100%}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:600}
.btn.on{border-color:var(--green);color:var(--green)}
.btn.off{border-color:var(--red);color:var(--red)}
.banner{border:1px solid #7a6422;background:#2a2410;border-radius:10px;padding:10px 12px;margin-bottom:14px}
.banner.warn{border-color:#7a3a3a;background:#2a1414}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--mute);font-weight:500;font-size:12px}
.tw{overflow-x:auto}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:40px;height:40px;font-size:18px;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}
.qty b{min-width:20px;text-align:center}
#modal{position:fixed;inset:0;background:rgba(3,6,14,.78);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:20;padding:20px 10px}
#modal.open{display:flex}
.sheet{min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:14px;width:100%;max-width:820px;padding:16px}
.sheet .top{display:flex;gap:10px;align-items:flex-start}
.sheet .top h2{flex:1;margin:0}
.desc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.th{width:44px;height:64px;flex:none;border-radius:4px;background:var(--panel2);border:1px solid var(--line);object-fit:cover}
.arts{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.arts button{background:none;border:0;padding:0}
.arts img{width:140px;border-radius:8px;border:1px solid var(--line);display:block;background:var(--panel2);min-height:200px}
#lb{position:fixed;inset:0;background:rgba(3,6,14,.92);display:none;align-items:center;justify-content:center;z-index:30;padding:12px;flex-direction:column;gap:8px;color:var(--mute)}
#lb.open{display:flex}
#lb img{max-width:100%;max-height:88vh;border-radius:10px}
.note{color:var(--mute);font-size:13px}
ul.plain{margin:6px 0;padding-left:18px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
label.chk{display:flex;gap:8px;align-items:flex-start;margin:8px 0}
label.chk input{margin-top:4px}
.prow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.prow .grow{flex:1;min-width:0}
.prow .t{font-weight:600;overflow-wrap:anywhere}
.prow .m{color:var(--mute);font-size:13px;overflow-wrap:anywhere;margin-bottom:4px}
nav button,.btn{min-height:38px}
</style>
</head>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const TODAY = todayStr();

/* ---------- saved user data (browser only) ---------- */
const KEY = 'heroArchive.web.v1';
const store = { owned: {}, over: {}, settings: { heroic: false, review: false, speed: false, support: true, related: true, mention: true }, seen: null };
let canSave = true;
function loadStore() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const j = JSON.parse(raw);
      store.owned = j.owned || {}; store.over = j.over || {}; store.seen = j.seen || null;
      store.settings = Object.assign(store.settings, j.settings || {});
    }
  } catch (e) { canSave = false; }
}
function saveStore() {
  try { localStorage.setItem(KEY, JSON.stringify(store)); }
  catch (e) { canSave = false; }
}

/* ---------- data ---------- */
const S = { data: null, cards: [], byId: new Map(), source: 'embedded snapshot', tab: 'dash',
            f: { q: '', arch: '', type: '', own: '', sort: 'name', set: '' }, newItems: null };

function prep(data, source) {
  S.data = data; S.source = source; S.cards = data.cards; S.byId = new Map();
  for (const c of S.cards) {
    S.byId.set(c.id, c);
    for (const p of c.p) { p.date = (data.sets[p.set] || {}).date || null; p.key = c.id + '~' + p.k; }
  }
}
function pStatus(p) {
  if (!p.en) return 'excluded';
  if (p.sd && !store.settings.speed) return 'speed';
  if (!p.date) return 'unknown';
  if (p.date > TODAY) return 'upcoming';
  return 'released';
}
const STATUS_LABEL = { released: ['Released','ok'], upcoming: ['Upcoming','warn'], unknown: ['Date unknown','warn'],
                       excluded: ['Not English','bad'], speed: ['Speed Duel (off)','warn'] };
const qty = p => store.owned[p.key] || 0;

function inScope(c) {
  const o = store.over[c.id];
  if (o === 'in') return true;
  if (o === 'out') return false;
  if (c.cat === 'hero') return true;
  if (c.cat === 'heroic') return store.settings.heroic;
  if (c.cat === 'review') return store.settings.review;
  if (c.cat === 'support') return store.settings.support;
  if (c.cat === 'related') return store.settings.related;
  if (c.cat === 'mention') return store.settings.mention;
  return false;
}
function derive(c) {
  const elig = c.p.filter(p => pStatus(p) === 'released');
  const owned = elig.filter(p => qty(p) > 0);
  const anyOwned = c.p.some(p => qty(p) > 0);
  let first = null;
  for (const p of elig) if (!first || p.date < first.date) first = p;
  return { elig, owned, anyOwned, first };
}
function typeGroup(c) { return c.type.includes('Monster') ? 'Monster' : c.type.includes('Spell') ? 'Spell' : c.type.includes('Trap') ? 'Trap' : c.type.includes('Skill') ? 'Skill' : c.type; }

/* ---------- loading ---------- */
async function loadData() {
  let seed = {};
  try { seed = JSON.parse($('#seed-data').textContent); } catch (e) {}
  if (seed.cards && seed.cards.length) prep(seed, 'snapshot inside this page');
  let fetchNote = '';
  if (location.protocol === 'file:') {
    fetchNote = 'page opened as a plain file, so only the snapshot inside the page is used';
  } else try {
    const r = await fetch('data/hero-data.json', { cache: 'no-cache' });
    if (r.ok) {
      const j = await r.json();
      if (j.schema === 1 && Array.isArray(j.cards) && j.cards.length &&
          (!seed.generated_at || j.generated_at >= seed.generated_at)) { prep(j, 'file data/hero-data.json'); }
    } else fetchNote = 'data/hero-data.json not found (HTTP ' + r.status + ')';
  } catch (e) { fetchNote = 'could not read data/hero-data.json (normal when the page is opened as a plain file)'; }
  S.fetchNote = fetchNote;
  if (!S.data) throw new Error('No card data found');
  checkNew();
}
function checkNew() {
  const ids = S.cards.map(c => c.id), sets = Object.keys(S.data.sets);
  if (!store.seen) { store.seen = { ids, sets, at: TODAY }; saveStore(); S.newItems = null; return; }
  const oi = new Set(store.seen.ids), os = new Set(store.seen.sets);
  const nc = S.cards.filter(c => !oi.has(c.id)), ns = sets.filter(s => !os.has(s));
  S.newItems = (nc.length || ns.length) ? { cards: nc, sets: ns } : null;
}

/* ---------- navigation ---------- */
const TABS = [['dash','Dashboard'],['cards','Cards'],['sets','Sets'],['review','Review'],['data','Data & backup']];
function renderNav() {
  $('#nav').innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${l}</button>`).join('');
}
$('#nav').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) go(b.dataset.tab); });
function go(tab) { S.tab = tab; render(); window.scrollTo(0, 0); }
function render() {
  renderNav();
  const v = $('#view');
  ({ dash: viewDash, cards: viewCards, sets: viewSets, review: viewReview, data: viewData })[S.tab](v);
  $('#sub').textContent = S.cards.length + ' cards in the data file · today ' + TODAY;
}

/* ---------- dashboard ---------- */
function pct(a, b) { return b ? Math.round(a * 100 / b) : 0; }
function bar(a, b) { return `<div class="bar"><i style="width:${pct(a, b)}%"></i></div>`; }
function stats() {
  const sc = S.cards.filter(inScope);
  let tc = 0, oc = 0, tp = 0, op = 0; const noPrint = [], byArch = {}, byType = {};
  for (const c of sc) {
    const d = derive(c);
    if (!d.elig.length) { noPrint.push(c); continue; }
    tc++; tp += d.elig.length; op += d.owned.length; if (d.owned.length) oc++;
    const a = c.arch || 'No archetype', t = typeGroup(c);
    for (const [m, k] of [[byArch, a], [byType, t]]) { m[k] = m[k] || [0, 0]; m[k][1]++; if (d.owned.length) m[k][0]++; }
  }
  return { sc, tc, oc, tp, op, noPrint, byArch, byType };
}
function viewDash(v) {
  const s = stats();
  let h = '';
  if (!canSave) h += `<div class="banner warn">Your collection cannot be saved in this view (browser storage is blocked). Use <b>Data &amp; backup → Export</b> before you leave.</div>`;
  if (S.newItems) {
    const n = S.newItems;
    h += `<div class="banner"><b>New since your last visit:</b> ${n.cards.length} card(s), ${n.sets.length} set(s).
      <details><summary>Show</summary><div class="note">${n.cards.map(c => esc(c.name)).join(' · ') || 'no new cards'}<br>${n.sets.map(esc).join(' · ') || 'no new sets'}</div></details>
      <p><button class="btn" id="seen">Got it</button></p></div>`;
  }
  h += `<h2>Dashboard</h2><div class="tiles">
    <div class="panel tile"><div class="sub">Unique cards owned</div><div class="big">${s.oc} / ${s.tc}</div>${bar(s.oc, s.tc)}<div class="sub">${pct(s.oc, s.tc)}% · cards with a verified released English printing</div></div>
    <div class="panel tile"><div class="sub">Printings owned</div><div class="big">${s.op} / ${s.tp}</div>${bar(s.op, s.tp)}<div class="sub">${pct(s.op, s.tp)}% · every set + rarity counts once</div></div>
    <div class="panel tile"><div class="sub">Cards in your scope</div><div class="big">${s.sc.length}</div><div class="sub">${s.noPrint.length} of them have no counted printing</div></div>
  </div>`;
  const rows = m => Object.entries(m).sort((a, b) => b[1][1] - a[1][1]).map(([k, [o, t]]) =>
    `<tr><td>${esc(k)}</td><td style="width:45%">${bar(o, t)}</td><td>${o} / ${t}</td></tr>`).join('');
  h += `<h3>By archetype</h3><div class="panel tw"><table><tbody>${rows(s.byArch)}</tbody></table></div>
        <h3>By card type</h3><div class="panel tw"><table><tbody>${rows(s.byType)}</tbody></table></div>`;
  if (s.noPrint.length) {
    h += `<h3>In scope but nothing to count</h3><div class="panel"><p class="note">These cards have no printing that is English, released with a known date, and allowed by your settings (for example Speed Duel skills, or cards with no TCG printing in the data).</p>
      <p>${s.noPrint.map(c => `<button class="badge" data-open="${c.id}">${esc(c.name)}</button>`).join(' ')}</p></div>`;
  }
  const up = [];
  for (const c of s.sc) for (const p of c.p) if (p.en && p.date && p.date > TODAY) up.push([p.date, p.set, c.name]);
  const unk = new Set(); for (const c of s.sc) for (const p of c.p) if (p.en && !p.date) unk.add(p.set);
  h += `<h3>Upcoming &amp; unclear</h3><div class="panel"><p>Upcoming HERO printings in your scope: <b>${up.length}</b>${up.length ? '<ul class="plain">' + up.sort().map(x => `<li>${esc(x[0])} — ${esc(x[1])} — ${esc(x[2])}</li>`).join('') + '</ul>' : ''}</p>
    <p>Sets with no release date in the data: <b>${unk.size}</b>${unk.size ? ' — ' + [...unk].map(esc).join(', ') : ''}</p></div>`;
  v.innerHTML = h;
  const sn = $('#seen'); if (sn) sn.onclick = () => { store.seen = { ids: S.cards.map(c => c.id), sets: Object.keys(S.data.sets), at: TODAY }; saveStore(); S.newItems = null; render(); };
}

/* ---------- cards ---------- */
function viewCards(v) {
  const archs = [...new Set(S.cards.filter(inScope).map(c => c.arch || 'No archetype'))].sort();
  const setNames = [...new Set(S.cards.filter(inScope).flatMap(c => c.p.map(p => p.set)))].sort();
  const f = S.f;
  const opt = (arr, cur, all) => `<option value="">${all}</option>` + arr.map(x => `<option ${x === cur ? 'selected' : ''}>${esc(x)}</option>`).join('');
  v.innerHTML = `<h2>Cards</h2>
    <div class="ctrl">
      <input type="search" id="fq" placeholder="Search name, card ID or set code" value="${esc(f.q)}" aria-label="Search">
      <select id="fa" aria-label="Archetype">${opt(archs, f.arch, 'All archetypes')}</select>
      <select id="ft" aria-label="Type">${opt(['Monster','Spell','Trap','Skill'], f.type, 'All types')}</select>
      <select id="fo" aria-label="Owned"><option value="">All</option><option value="own" ${f.own === 'own' ? 'selected' : ''}>Owned</option><option value="miss" ${f.own === 'miss' ? 'selected' : ''}>Missing</option></select>
      <select id="fs" aria-label="Sort">${[['name','Sort: name'],['new','Sort: newest first English print'],['old','Sort: oldest first English print'],['owned','Sort: owned first']].map(([k, l]) => `<option value="${k}" ${f.sort === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <select id="fset" aria-label="Set">${opt(setNames, f.set, 'All sets')}</select>
    </div>
    <div class="note" id="cnt"></div><div id="list"></div>`;
  const bind = (id, key) => $(id).addEventListener('input', e => { f[key] = e.target.value; list(); });
  bind('#fq', 'q'); bind('#fa', 'arch'); bind('#ft', 'type'); bind('#fo', 'own'); bind('#fs', 'sort'); bind('#fset', 'set');
  list();
}
function list() {
  const f = S.f, q = f.q.trim().toLowerCase();
  let rows = S.cards.filter(inScope).map(c => ({ c, d: derive(c) }));
  rows = rows.filter(({ c, d }) => {
    if (q && !(c.name.toLowerCase().includes(q) || String(c.id) === q || c.p.some(p => p.code.toLowerCase().includes(q)))) return false;
    if (f.arch && (c.arch || 'No archetype') !== f.arch) return false;
    if (f.type && typeGroup(c) !== f.type) return false;
    if (f.set && !c.p.some(p => p.set === f.set)) return false;
    if (f.own === 'own' && !d.owned.length) return false;
    if (f.own === 'miss' && d.owned.length) return false;
    return true;
  });
  const dt = r => r.d.first ? r.d.first.date : '';
  const sorters = { name: (a, b) => a.c.name.localeCompare(b.c.name),
    new: (a, b) => (dt(b) || '').localeCompare(dt(a) || '') || a.c.name.localeCompare(b.c.name),
    old: (a, b) => (dt(a) || '9999').localeCompare(dt(b) || '9999') || a.c.name.localeCompare(b.c.name),
    owned: (a, b) => b.d.owned.length - a.d.owned.length || a.c.name.localeCompare(b.c.name) };
  rows.sort(sorters[f.sort]);
  $('#cnt').textContent = rows.length + ' card(s) shown';
  $('#list').innerHTML = rows.map(({ c, d }) => `<button class="row" data-open="${c.id}">
      ${c.arts.length ? `<img class="th" src="images/small/${c.arts[0]}.jpg" loading="lazy" alt="" onerror="this.style.visibility='hidden'">` : '<span class="th"></span>'}
      <div class="grow"><div class="t">${esc(c.name)}</div>
      <div class="m">${esc(c.kind)}${c.arch ? ' · ' + esc(c.arch) : ''} · ${d.first ? 'first English print ' + esc(d.first.date) : 'no counted printing'}</div></div>
      <span class="badge ${d.owned.length ? 'ok' : ''}">${d.owned.length} / ${d.elig.length}</span></button>`).join('') || '<p class="note">No cards match.</p>';
}

/* ---------- sets ---------- */
function viewSets(v) {
  const m = new Map();
  for (const c of S.cards.filter(inScope)) for (const p of c.p) {
    const e = m.get(p.set) || { set: p.set, cards: new Set(), own: new Set(), pr: [] };
    e.cards.add(c.id); e.pr.push(p); if (qty(p) > 0) e.own.add(c.id); m.set(p.set, e);
  }
  const q = (S.setQ || '').toLowerCase();
  const arr = [...m.values()].filter(e => !q || e.set.toLowerCase().includes(q) || (S.data.sets[e.set].code || '').toLowerCase().includes(q))
    .sort((a, b) => ((S.data.sets[b.set].date || '') .localeCompare(S.data.sets[a.set].date || '')) || a.set.localeCompare(b.set));
  v.innerHTML = `<h2>Sets</h2><p class="note">Only sets that contain at least one card in your scope. Dates are the set's TCG release date from the data file (not a date for each card).</p>
    <div class="ctrl"><input type="search" id="sq" placeholder="Search set name or code" value="${esc(S.setQ || '')}" aria-label="Search sets"></div><div id="slist"></div>`;
  const draw = () => {
    $('#slist').innerHTML = arr.map(e => {
      const meta = S.data.sets[e.set], st = e.pr.map(pStatus);
      const label = st.every(x => x === 'excluded') ? 'excluded' : st.includes('released') ? 'released' : st.includes('upcoming') ? 'upcoming' : st.includes('speed') ? 'speed' : 'unknown';
      return `<button class="row" data-set="${esc(e.set)}"><div class="grow"><div class="t">${esc(e.set)}</div>
        <div class="m">${esc(meta.code)} · ${meta.date ? esc(meta.date) : 'no date in data'}</div></div>
        <span class="badge ${STATUS_LABEL[label][1]}">${STATUS_LABEL[label][0]}</span><span class="badge ${e.own.size ? 'ok' : ''}">${e.own.size} / ${e.cards.size}</span></button>`;
    }).join('') || '<p class="note">No sets match.</p>';
  };
  draw();
  $('#sq').addEventListener('input', ev => { S.setQ = ev.target.value; viewSets(v); const i = $('#sq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); });
}

/* ---------- review ---------- */
function stateLabel(c) { return inScope(c) ? '<span class="badge ok">Counted</span>' : '<span class="badge">Not counted</span>'; }
function reviewRows(cat) {
  return S.cards.filter(c => c.cat === cat).map(c => `<div class="row"><div class="grow"><div class="t"><button class="badge gold" data-open="${c.id}">${esc(c.name)}</button> ${stateLabel(c)} ${store.over[c.id] ? '<span class="badge gold">your choice</span>' : ''}</div>
      <div class="m">${esc(c.why)}${c.arch ? ' · archetype ' + esc(c.arch) : ''}</div></div>
      <button class="btn ${store.over[c.id] === 'in' ? 'on' : ''}" data-ov="${c.id}:in">Count</button>
      <button class="btn ${store.over[c.id] === 'out' ? 'off' : ''}" data-ov="${c.id}:out">Don't count</button>
      <button class="btn" data-ov="${c.id}:">Default</button></div>`).join('') || '<p class="note">None.</p>';
}
function viewReview(v) {
  const n = k => S.cards.filter(c => c.cat === k).length;
  v.innerHTML = `<h2>Review</h2><p class="note">The page sorts cards by simple rules. Your choices here are saved in this browser and included in the backup.</p>
    <h3>Added from your wiki list: Support (${n('support')})</h3><p class="note">Cards named in <code>extra_cards.txt</code> under Support. Counted by default. Press “Don't count” on any card that is not really related — it disappears from your lists and progress.</p>${reviewRows('support')}
    <h3>Added from your wiki list: Related (${n('related')})</h3><p class="note">Related cards (Neo-Spacians, Polymerization, and so on). Counted by default; you can switch the whole group off in Data &amp; backup, or card by card here.</p>${reviewRows('related')}
    <h3>Found by the audit: text mentions HERO (${n('mention')})</h3><p class="note">English-printed cards that are not in a HERO archetype but whose text mentions HERO, plus Neo-Spacian/Neos cards. Not counted until you press “Count” or switch the group on in Data &amp; backup.</p>${reviewRows('mention')}
    <h3>Needs your decision (${n('review')})</h3><p class="note">These have the word “Hero” in the name, or their effect mentions a HERO card, but they are not in a HERO archetype in the data.</p>${reviewRows('review')}
    <h3>Heroic family (${n('heroic')})</h3><p class="note">Archetype “Heroic” — a different family from HERO. Not counted unless you turn it on in Data &amp; backup, or choose cards one by one.</p>${reviewRows('heroic')}
    <h3>Probably not HERO (${n('noise')})</h3><p class="note">No HERO word as a word in the name and no HERO archetype — most likely in the file only because the name contains the letters “hero” or “hire”.</p>${reviewRows('noise')}`;
}

/* ---------- data & backup ---------- */
function viewData(v) {
  const cats = {}; for (const c of S.cards) cats[c.cat] = (cats[c.cat] || 0) + 1;
  const st = {}; let tp = 0; for (const c of S.cards) for (const p of c.p) { const k = pStatus(p); st[k] = (st[k] || 0) + 1; tp++; }
  const noPr = S.cards.filter(c => !c.p.length);
  const s = store.settings, d = S.data;
  v.innerHTML = `<h2>Data &amp; backup</h2>
    <div class="panel"><b>Scope</b>
      <label class="chk"><input type="checkbox" data-set="support" ${s.support ? 'checked' : ''}><span>Count wiki “Support” cards that you added by name (${cats.support || 0})</span></label>
      <label class="chk"><input type="checkbox" data-set="related" ${s.related ? 'checked' : ''}><span>Count wiki “Related” cards that you added by name (${cats.related || 0})</span></label>
      <label class="chk"><input type="checkbox" data-set="mention" ${s.mention ? 'checked' : ''}><span>Count cards found by the audit whose text mentions HERO (${cats.mention || 0})</span></label>
      <label class="chk"><input type="checkbox" data-set="heroic" ${s.heroic ? 'checked' : ''}><span>Count the “Heroic” family (${cats.heroic || 0} cards) — a different archetype from HERO</span></label>
      <label class="chk"><input type="checkbox" data-set="review" ${s.review ? 'checked' : ''}><span>Count the cards that need review (${cats.review || 0}) — decide them one by one in Review instead if you prefer</span></label>
      <label class="chk"><input type="checkbox" data-set="speed" ${s.speed ? 'checked' : ''}><span>Count Speed Duel printings (English, but a separate product line)</span></label></div>
    <h3>Where this data comes from</h3>
    <div class="panel"><ul class="plain">
      <li>Loaded from: <b>${esc(S.source)}</b>${S.fetchNote ? ' <span class="note">(' + esc(S.fetchNote) + ')</span>' : ''}</li>
      <li>Data file built: <b>${esc(d.generated_at)}</b> · rules ${esc(d.rule_version)}</li>
      <li>Cards in the file: <b>${S.cards.length}</b> (HERO ${cats.hero || 0}, wiki support ${cats.support || 0}, wiki related ${cats.related || 0}, audit candidates ${cats.mention || 0}, Heroic ${cats.heroic || 0}, needs review ${cats.review || 0}, probably not HERO ${cats.noise || 0})</li>
      <li>Printings: <b>${tp}</b> — released ${st.released || 0}, upcoming ${st.upcoming || 0}, date unknown ${st.unknown || 0}, Speed Duel ${st.speed || 0}, not English ${st.excluded || 0}</li>
      <li>Sets used: <b>${Object.keys(d.sets).length}</b> of ${d.source.sets_in_file} in the sets file</li>
      <li>Cards with no printing at all in the data: <b>${noPr.length}</b>${noPr.length ? ' — ' + noPr.map(c => esc(c.name)).join(', ') : ''}</li></ul>
      <p class="note"><b>Limits.</b> A printing counts as “released” only when its set has a full TCG date (year-month-day) that is not after today, and its code looks English. The date belongs to the set, so a card reprinted in a later set has its own date for that printing. The data does not say which artwork a printing uses. The page cannot know about cards that are missing from the data file.</p>
      <button class="btn" id="reload">Check for newer data file</button> <span class="note" id="reloadmsg"></span></div>
    <h3>Backup</h3>
    <div class="panel"><p class="note">Your collection lives only in this browser. Export a copy now and then.</p>
      <p><button class="btn primary" id="exp">Export backup</button>
      <label class="btn">Import (replace)<input type="file" id="impR" accept=".json,application/json" hidden></label>
      <label class="btn">Import (merge, higher count wins)<input type="file" id="impM" accept=".json,application/json" hidden></label></p>
      <p><button class="btn" id="cp">Copy backup text</button></p>
      <textarea id="bk" rows="4" style="width:100%" placeholder="Backup text appears here after Export" aria-label="Backup text"></textarea>
      <p class="note" id="bkmsg"></p>
      <p><button class="btn" id="reset">Delete my collection &amp; choices</button></p></div>`;
  v.querySelectorAll('input[data-set]').forEach(i => i.onchange = () => { store.settings[i.dataset.set] = i.checked; saveStore(); viewData(v); });
  $('#reload').onclick = async () => { $('#reloadmsg').textContent = 'Checking…'; const before = S.data.generated_at; await loadData(); render(); const m = $('#reloadmsg'); if (m) m.textContent = S.data.generated_at !== before ? 'Loaded newer data.' : 'Nothing newer found.'; };
  $('#exp').onclick = exportBackup;
  $('#cp').onclick = async () => { const t = $('#bk'); if (!t.value) exportBackup(); t.select();
    try { await navigator.clipboard.writeText(t.value); $('#bkmsg').textContent = 'Copied.'; } catch (e) { $('#bkmsg').textContent = 'Could not copy automatically — the text is selected, press Ctrl+C (or long-press → Copy).'; } };
  $('#impR').onchange = e => importBackup(e.target.files[0], false);
  $('#impM').onchange = e => importBackup(e.target.files[0], true);
  let armed = false; const rb = $('#reset');
  rb.onclick = () => { if (!armed) { armed = true; rb.textContent = 'Click again to really delete'; rb.classList.add('off'); return; } store.owned = {}; store.over = {}; saveStore(); render(); };
}
function exportBackup() {
  const out = { app: 'hero-archive-web', version: 1, exported_at: new Date().toISOString(), owned: store.owned, over: store.over, settings: store.settings };
  const txt = JSON.stringify(out, null, 1);
  $('#bk').value = txt;
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = 'hero-archive-backup-' + TODAY + '.json'; document.body.appendChild(a); a.click(); a.remove(); $('#bkmsg').textContent = 'Download started. If no file appears, use “Copy backup text” and save it yourself.'; }
  catch (e) { $('#bkmsg').textContent = 'Could not start a download — copy the text from the box above and save it yourself.'; }
}
async function importBackup(file, merge) {
  const msg = $('#bkmsg');
  if (!file) return;
  try {
    const j = JSON.parse(await file.text());
    if (j.app !== 'hero-archive-web' || typeof j.owned !== 'object' || j.owned === null) throw new Error('This is not a HERO Archive backup file.');
    const owned = {};
    for (const [k, n] of Object.entries(j.owned)) { if (Number.isInteger(n) && n > 0 && n < 1000) owned[k] = n; }
    const over = {}; for (const [k, o] of Object.entries(j.over || {})) if (o === 'in' || o === 'out') over[k] = o;
    if (merge) { for (const [k, n] of Object.entries(owned)) store.owned[k] = Math.max(store.owned[k] || 0, n); Object.assign(store.over, over); }
    else { store.owned = owned; store.over = over; }
    if (j.settings) for (const k of ['heroic', 'review', 'speed', 'support', 'related', 'mention']) if (typeof j.settings[k] === 'boolean') store.settings[k] = j.settings[k];
    saveStore(); render(); const m = $('#bkmsg'); if (m) m.textContent = 'Imported ' + Object.keys(owned).length + ' owned printing(s).';
  } catch (e) { msg.textContent = 'Import failed: ' + e.message; }
}

/* ---------- card detail ---------- */
let lastFocus = null;
function openCard(id) {
  const c = S.byId.get(id); if (!c) return;
  lastFocus = document.activeElement;
  const d = derive(c), o = store.over[c.id];
  const stats = [c.attr, c.lvl != null ? 'Level/Rank ' + c.lvl : '', c.link != null ? 'Link ' + c.link : '', c.atk != null ? 'ATK ' + c.atk : '', c.def != null ? 'DEF ' + c.def : ''].filter(Boolean).join(' · ');
  const prs = [...c.p].sort((a, b) => (b.date || '').localeCompare(a.date || '') || a.code.localeCompare(b.code));
  $('#sheet').innerHTML = `<div class="top"><h2>${esc(c.name)}</h2><button class="btn" id="x" aria-label="Close">✕</button></div>
    <p class="note">${esc(c.kind)}${c.race ? ' · ' + esc(c.race) : ''}${stats ? ' · ' + esc(stats) : ''}${c.arch ? ' · ' + esc(c.arch) : ''} · ID ${c.id}</p>
    <div class="arts">${c.arts.map(a => `<button data-zoom="${a}" aria-label="Enlarge image of ${esc(c.name)}"><img src="images/small/${a}.jpg" alt="${esc(c.name)}" onerror="this.alt='No image file yet';this.style.minHeight='0'"></button>`).join('')}</div>
    ${c.arts.length > 1 ? '<p class="note">This card has ' + c.arts.length + ' artworks. The data does not say which artwork each printing uses.</p>' : ''}
    <div class="desc">${esc(c.desc)}</div>
    <p>${stateLabel(c)} <span class="note">${esc(c.why)}</span>
      <button class="btn ${o === 'in' ? 'on' : ''}" data-ov="${c.id}:in">Count</button>
      <button class="btn ${o === 'out' ? 'off' : ''}" data-ov="${c.id}:out">Don't count</button>
      <button class="btn" data-ov="${c.id}:">Default</button></p>
    <p>${d.first ? 'First released English printing: <b>' + esc(d.first.date) + '</b> (' + esc(d.first.set) + ')' : 'No counted printing for this card.'}</p>
    <div>
    ${prs.map(p => { const s = pStatus(p), l = STATUS_LABEL[s]; return `<div class="prow"><div class="grow"><div class="t">${esc(p.set)}</div>
      <div class="m">${esc(p.code)} · ${esc(p.rar)}${p.rc ? ' ' + esc(p.rc) : ''} · ${p.date ? esc(p.date) : 'no date'}</div><span class="badge ${l[1]}">${l[0]}</span></div>
      <span class="qty"><button data-q="${esc(p.key)}:-1" aria-label="Remove one">−</button><b>${qty(p)}</b><button data-q="${esc(p.key)}:1" aria-label="Add one">+</button></span></div>`; }).join('') || '<p class="note">No TCG printing in the data file.</p>'}
    </div>
    <p><a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">Open on YGOPRODeck</a></p>`;
  $('#modal').classList.add('open'); $('#x').focus();
}
function openLb(a) { const lb = $('#lb'); lb.innerHTML = `<img src="images/large/${a}.jpg" alt="Large card image" onerror="this.replaceWith(document.createTextNode('Large image file not found.'))"><span>Click anywhere or press Esc to close</span>`; lb.classList.add('open'); }
function closeLb() { $('#lb').classList.remove('open'); }
function closeCard() { $('#modal').classList.remove('open'); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
function openId() { const t = $('#sheet h2'); return t ? S.cards.find(c => c.name === t.textContent) : null; }

/* ---------- global clicks ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  if ($('#lb').classList.contains('open')) return closeLb();
  const zm = t.closest('[data-zoom]'); if (zm) return openLb(zm.dataset.zoom);
  if (t.id === 'modal' || t.closest('#x')) return closeCard();
  const q = t.closest('[data-q]');
  if (q) { const [k, dlt] = [q.dataset.q.slice(0, q.dataset.q.lastIndexOf(':')), +q.dataset.q.slice(q.dataset.q.lastIndexOf(':') + 1)];
    const n = Math.max(0, Math.min(999, (store.owned[k] || 0) + dlt)); if (n) store.owned[k] = n; else delete store.owned[k]; saveStore();
    const c = openId(); if (c) { const y = $('#modal').scrollTop; openCard(c.id); $('#modal').scrollTop = y; } refreshBehind(); return; }
  const ov = t.closest('[data-ov]');
  if (ov) { const [id, val] = ov.dataset.ov.split(':'); if (val) store.over[id] = val; else delete store.over[id]; saveStore();
    if ($('#modal').classList.contains('open')) { const y = $('#modal').scrollTop; openCard(+id); $('#modal').scrollTop = y; } refreshBehind(); return; }
  const op = t.closest('[data-open]'); if (op) return openCard(+op.dataset.open);
  const st = t.closest('button[data-set]'); if (st && st.classList.contains('row')) { S.f = { q: '', arch: '', type: '', own: '', sort: 'name', set: st.dataset.set }; return go('cards'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#lb').classList.contains('open')) return closeLb(); if (e.key === 'Escape' && $('#modal').classList.contains('open')) closeCard(); });
function refreshBehind() { const y = window.scrollY; const keep = document.activeElement; render(); window.scrollTo(0, y); }

/* ---------- start ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
loadStore();
loadData().then(render).catch(err => { $('#view').innerHTML = '<div class="banner warn"><b>Could not load card data.</b> ' + esc(err.message) + '</div>'; });
</script>
</body>
</html>
