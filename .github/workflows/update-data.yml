# Refreshes data/hero-data.json every day. NOT TESTED yet - see README_HE.md.
name: Update card data
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download raw files
        run: python3 -I scripts/fetch_sources.py raw
      - name: Build data file and refresh the snapshot inside index.html
        run: python3 -I scripts/build_data.py --cards raw/cardinfo.json --sets raw/cardsets.json --out data/hero-data.json --html index.html
      - name: Commit if something changed
        run: |
          git config user.name "hero-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          # build_data.py leaves hero-data.json alone when only the timestamp would change,
          # but the raw download can still differ in prices etc., so only commit if the data file changed
          git checkout -- raw
          if [ -z "$(git status --porcelain)" ]; then echo "No real change"; exit 0; fi
          git add -A
          git commit -m "Update card data"
          git push
